<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient
                id="techGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#00c6ff" />
                <stop offset="100%" stop-color="#0072ff" />
              </linearGradient>
            </defs>

            <circle
              cx="100"
              cy="100"
              r="80"
              stroke="url(#techGradient)"
              stroke-width="3"
              fill="none"
            />

            <g>
              <ellipse
                cx="100"
                cy="100"
                rx="60"
                ry="25"
                stroke="url(#techGradient)"
                stroke-width="3"
                fill="none"
              />
              <animateTransform
                attributeName="transform"
                type="rotate"
                from="0 100 100"
                to="360 100 100"
                dur="6s"
                repeatCount="indefinite"
              />
            </g>

            <circle cx="100" cy="100" r="7" fill="url(#techGradient)" />

            <path
              d="M65 70 H135 M100 70 V140"
              stroke="url(#techGradient)"
              stroke-width="5"
              stroke-linecap="round"
            />
          </svg>